<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinity Space Mission</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#172856,#020612 60%);color:white;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:#071020e8;border:1px solid #31548d;border-radius:28px;padding:20px;margin-top:14px}.hidden{display:none!important}h1{font-size:clamp(42px,8vw,86px);line-height:.9;margin:10px 0}h1 b{color:#33dbff}.btn{border:0;border-radius:17px;padding:16px 22px;font-size:18px;font-weight:bold;background:linear-gradient(90deg,#35d8ff,#8c63ff);color:white;cursor:pointer;margin:5px}.hero{min-height:540px;display:grid;grid-template-columns:1.1fr .8fr;align-items:center;gap:20px;background:radial-gradient(circle at 80% 20%,#6848b455,transparent 18%),linear-gradient(#07132d,#030714);border-radius:24px;padding:26px;overflow:hidden}.rocket{font-size:160px;text-align:center;animation:f 1s infinite alternate}@keyframes f{to{transform:translateY(-12px)}}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.hud div{background:#0a1426;border:1px solid #31548d;border-radius:16px;padding:10px;text-align:center}.hud span{display:block;font-size:11px;color:#9db1d1;font-weight:bold}.hud b{font-size:22px}.space{position:relative;min-height:610px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 80% 15%,#263f8455,transparent 13%),radial-gradient(circle at 15% 20%,#7d5cff44,transparent 15%),linear-gradient(#030714,#071331);margin-top:12px}.stars{position:absolute;inset:0;color:#ffffff99;font-size:30px;letter-spacing:34px;line-height:4;transform:rotate(-8deg)}.ship{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);font-size:85px;transition:.6s;z-index:3}.obj{position:absolute;font-size:50px}.a1{left:12%;top:28%}.a2{right:12%;top:36%}.c1{left:30%;top:30%}.c2{right:32%;top:25%}.qbox{position:relative;z-index:5;background:#060d1bec;border:1px solid #31548d;border-radius:20px;padding:16px;max-width:900px;margin:340px auto 0}.skill{color:#77f2b0;font-size:13px;font-weight:bold}.q{font-size:clamp(20px,3vw,30px);font-weight:bold;margin:8px 0 14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:bold;background:#fff;color:#0b1422;cursor:pointer;min-height:60px}.fb{min-height:48px;text-align:center;font-size:21px;font-weight:bold;padding-top:10px}.final{text-align:center}.final .icon{font-size:120px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#10182b;border-radius:18px;padding:16px}.stat b{display:block;font-size:28px;color:#35d8ff}@media(max-width:700px){.hero{grid-template-columns:1fr}.hud{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.qbox{margin-top:370px}.stats{grid-template-columns:1fr 1fr}}

.rocketReal{position:relative;z-index:2;text-align:center}
.rocketReal img{width:min(100%,430px);height:410px;object-fit:cover;border-radius:26px;
border:2px solid #43dcff;box-shadow:0 0 32px #2ddcff55,0 20px 45px #000b}
.ship{width:115px;height:165px;overflow:hidden;border-radius:55px 55px 20px 20px;
box-shadow:0 0 28px #ffb34777;transition:.6s}
.ship img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:saturate(1.15) contrast(1.08)}
.space:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
width:220px;height:180px;background:radial-gradient(ellipse at top,#fff7 0,#ffb13c99 18%,#ff5b2366 38%,transparent 68%);
filter:blur(5px);z-index:1;pointer-events:none}

/* Camadas animadas do espaço */
.space{isolation:isolate}
.space .stars{animation:starDrift 12s linear infinite}
@keyframes starDrift{
  0%{transform:translate3d(0,-20px,0) rotate(-8deg)}
  50%{transform:translate3d(-35px,28px,0) rotate(-8deg)}
  100%{transform:translate3d(-70px,76px,0) rotate(-8deg)}
}
.obj.a1{animation:asteroidOne 6.8s linear infinite}
.obj.a2{animation:asteroidTwo 8.4s linear infinite}
@keyframes asteroidOne{
  0%{transform:translate(-80px,-70px) rotate(0deg);opacity:0}
  12%{opacity:1}
  100%{transform:translate(520px,430px) rotate(720deg);opacity:.15}
}
@keyframes asteroidTwo{
  0%{transform:translate(160px,-90px) rotate(0deg);opacity:0}
  15%{opacity:1}
  100%{transform:translate(-520px,390px) rotate(-650deg);opacity:.18}
}
.obj.c1,.obj.c2{
  filter:drop-shadow(0 0 12px #51e7ff);
  animation:crystalFloat 2.1s ease-in-out infinite alternate,crystalGlow 1.1s ease-in-out infinite alternate
}
.obj.c2{animation-delay:-.85s}
@keyframes crystalFloat{
  from{transform:translateY(-12px) rotate(-8deg) scale(.92)}
  to{transform:translateY(18px) rotate(9deg) scale(1.08)}
}
@keyframes crystalGlow{
  from{filter:drop-shadow(0 0 7px #51e7ff);opacity:.75}
  to{filter:drop-shadow(0 0 23px #ff55c8);opacity:1}
}
.planet.p1{animation:planetPulse 7s ease-in-out infinite alternate}
.planet.p2{animation:planetPulse 9s ease-in-out infinite alternate-reverse}
@keyframes planetPulse{
  from{transform:translate(0,0) scale(.95)}
  to{transform:translate(-18px,12px) scale(1.06)}
}
.spaceComet{
  position:absolute;z-index:1;left:-18%;top:12%;width:130px;height:3px;
  background:linear-gradient(90deg,transparent,#8eeeff,#fff);
  transform:rotate(22deg);filter:drop-shadow(0 0 8px #5be9ff);
  animation:cometFly 7.3s linear infinite;opacity:0
}
.spaceComet::after{
  content:"";position:absolute;right:-5px;top:-4px;width:11px;height:11px;
  border-radius:50%;background:#fff;box-shadow:0 0 16px #8eeeff
}
@keyframes cometFly{
  0%,12%{transform:translate(-100px,-80px) rotate(22deg);opacity:0}
  18%{opacity:1}
  60%{opacity:1}
  78%,100%{transform:translate(1150px,410px) rotate(22deg);opacity:0}
}
.spaceDust{
  position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background-image:
   radial-gradient(circle,#fff 0 1px,transparent 1.5px),
   radial-gradient(circle,#7be9ff 0 1px,transparent 1.5px);
  background-size:56px 56px,93px 93px;
  background-position:0 0,22px 35px;
  opacity:.28;animation:dustMove 18s linear infinite
}
@keyframes dustMove{
  to{transform:translate(-120px,145px)}
}
.ship{animation:shipFloat 1.9s ease-in-out infinite alternate}
@keyframes shipFloat{
  from{margin-left:-5px}
  to{margin-left:5px}
}
.ship.boosting{animation:shipBoost .55s ease-out}
@keyframes shipBoost{
  30%{filter:brightness(1.5) drop-shadow(0 0 24px #ffbd42);transform:translateX(-50%) scale(1.08)}
  100%{transform:translateX(-50%) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .space .stars,.obj,.planet,.spaceComet,.spaceDust,.ship{animation:none!important}
}


/* Movimento contínuo mais perceptível */
.space{perspective:800px}
.flyStar{position:absolute;z-index:1;color:#fff;opacity:.75;animation:flyStar linear infinite}
.flyStar.s1{left:5%;top:-8%;font-size:20px;animation-duration:5s}
.flyStar.s2{left:33%;top:-12%;font-size:13px;animation-duration:7s;animation-delay:-3s}
.flyStar.s3{left:68%;top:-15%;font-size:25px;animation-duration:6s;animation-delay:-1s}
.flyStar.s4{left:88%;top:-5%;font-size:16px;animation-duration:8s;animation-delay:-5s}
@keyframes flyStar{to{transform:translate(120px,760px) scale(1.8);opacity:.15}}

.movingAsteroid{position:absolute;z-index:2;font-size:52px;filter:drop-shadow(0 5px 6px #000)}
.movingAsteroid.m1{left:-12%;top:18%;animation:astFly1 8s linear infinite}
.movingAsteroid.m2{right:-15%;top:30%;animation:astFly2 11s linear infinite  -4s}
.movingAsteroid.m3{left:40%;top:-15%;font-size:35px;animation:astFly3 9s linear infinite -2s}
@keyframes astFly1{to{transform:translate(1250px,410px) rotate(900deg)}}
@keyframes astFly2{to{transform:translate(-1250px,330px) rotate(-760deg)}}
@keyframes astFly3{to{transform:translate(400px,760px) rotate(700deg)}}

.cometBig{
 position:absolute;z-index:2;left:-28%;top:5%;width:190px;height:5px;
 background:linear-gradient(90deg,transparent,#51dfff88,#c9f7ff,#fff);
 transform:rotate(17deg);filter:drop-shadow(0 0 11px #58e6ff);
 animation:cometBigFly 6.5s linear infinite
}
.cometBig:after{content:"";position:absolute;right:-7px;top:-6px;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 0 25px #6be9ff}
@keyframes cometBigFly{
 0%,8%{transform:translate(-100px,-100px) rotate(17deg);opacity:0}
 15%{opacity:1}
 75%{opacity:1}
 90%,100%{transform:translate(1450px,520px) rotate(17deg);opacity:0}
}

.crystalTraveler{
 position:absolute;z-index:2;font-size:32px;filter:drop-shadow(0 0 15px #3ceeff);
 animation:crystalTravel linear infinite
}
.crystalTraveler.t1{left:12%;top:12%;animation-duration:9s}
.crystalTraveler.t2{left:75%;top:5%;animation-duration:12s;animation-delay:-5s}
@keyframes crystalTravel{
 0%{transform:translateY(-100px) rotate(0deg);opacity:0}
 12%{opacity:1}
 88%{opacity:1}
 100%{transform:translate(-100px,720px) rotate(540deg);opacity:0}
}

<section id="finish" class="panel final hidden"><div class="icon">🌌🏆🚀</div><h1>PORTAL ALCANÇADO!</h1><div class="stats"><div class="stat">ACERTOS<b id="fHits"></b></div><div class="stat">CRISTAIS<b id="fCrystals"></b></div><div class="stat">PONTOS<b id="fScore"></b></div><div class="stat">TEMPO<b id="fTime"></b></div></div><button class="btn" onclick="location.reload()">🔁 NOVA MISSÃO</button></section></div>
<script>
const Q=[{"q": "Uma estação espacial recebeu 2,5 toneladas de suprimentos e depois mais 1,75 tonelada. Qual foi o total recebido?", "o": ["3,25 t", "4,00 t", "4,25 t", "4,75 t"], "a": 2, "skill": "Números decimais"}, {"q": "Em um mapa estelar, 1 cm representa 40 km. Uma rota mede 6 cm no mapa. Qual é a distância real?", "o": ["180 km", "200 km", "220 km", "240 km"], "a": 3, "skill": "Escala e proporcionalidade"}, {"q": "Um módulo espacial tem 18 cápsulas. Se 1/3 delas forem usadas, quantas restam?", "o": ["6", "9", "12", "15"], "a": 2, "skill": "Frações"}, {"q": "Uma bateria estava com 80% de carga e gastou 25 pontos percentuais. Com quantos por cento ficou?", "o": ["45%", "50%", "55%", "60%"], "a": 2, "skill": "Porcentagem"}, {"q": "No plano cartesiano, uma sonda está no ponto (−3, 4). Em qual quadrante ela se encontra?", "o": ["I", "II", "III", "IV"], "a": 1, "skill": "Plano cartesiano"}, {"q": "Um reservatório em forma de paralelepípedo mede 4 m × 3 m × 2 m. Qual é seu volume?", "o": ["12 m³", "18 m³", "24 m³", "36 m³"], "a": 2, "skill": "Volume"}, {"q": "Uma missão cobra taxa fixa de R$ 15 mais R$ 6 por etapa concluída. Qual é o custo após 5 etapas?", "o": ["R$ 30", "R$ 35", "R$ 40", "R$ 45"], "a": 3, "skill": "Função afim"}, {"q": "Em uma caixa há 5 cristais azuis e 3 rosas. A probabilidade de retirar um cristal rosa é:", "o": ["3/5", "3/8", "5/8", "1/2"], "a": 1, "skill": "Probabilidade"}, {"q": "Um investimento de R$ 1.000 rende juros simples de 2% ao mês durante 4 meses. Qual é o juro total?", "o": ["R$ 40", "R$ 60", "R$ 80", "R$ 100"], "a": 2, "skill": "Juros simples"}, {"q": "A altura de uma nave é dada por h(t)=−t²+8t+5. Em qual instante t ocorre a altura máxima?", "o": ["2", "3", "4", "8"], "a": 2, "skill": "Função quadrática"}];let i=0,hits=0,cr=0,score=0,energy=50,locked=false,startAt=0,timer=null,ctxA=null,music=true,musicTimer=null;const $=x=>document.getElementById(x);
function ac(){if(!ctxA)ctxA=new (AudioContext||webkitAudioContext)();if(ctxA.state==="suspended")ctxA.resume();return ctxA}
function tone(f,d=.15,type="sine",v=.04,delay=0){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);let t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d=.2,v=.03){try{let a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dt=b.getChannelData(0);for(let k=0;k<dt.length;k++)dt[k]=(Math.random()*2-1)*(1-k/dt.length);let s=a.createBufferSource(),g=a.createGain();s.buffer=b;s.connect(g);g.connect(a.destination);g.gain.value=v;s.start()}catch(e){}}
function launch(){noise(.5,.06);[100,150,220,330].forEach((f,k)=>tone(f,.25,"sawtooth",.04,k*.07))}
function crystal(){[650,900,1200].forEach((f,k)=>tone(f,.14,"triangle",.05,k*.06))}
function errorFx(){tone(150,.22,"square",.05);noise(.12,.03)}
function startMusic(){clearInterval(musicTimer);let s=0,b=[82,98,110,98,73,82,98,110],l=[330,392,440,494,440,392,330,294];musicTimer=setInterval(()=>{if(!music)return;let x=b[s%8],y=l[s%8];tone(x,.3,"triangle",.012);if(s%2===0)tone(y,.18,"triangle",.01,.08);s++},360)}
function toggleMusic(){music=!music;$("musicBtn").textContent=music?"🎵 MÚSICA ON":"🎵 MÚSICA OFF";if(music){ac();startMusic()}else clearInterval(musicTimer)}
function begin(){ac();$("start").classList.add("hidden");$("game").classList.remove("hidden");startAt=Date.now();timer=setInterval(clock,250);launch();startMusic();render()}
function clock(){let t=Math.floor((Date.now()-startAt)/1000);$("clock").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function render(){locked=false;let x=Q[i];$("counter").textContent=`${i+1}/10`;$("skill").textContent=x.skill;$("question").textContent=x.q;$("feedback").textContent="";$("answers").innerHTML=x.o.map((o,n)=>`<button class="ans" onclick="answer(${n},this)"><b>${String.fromCharCode(65+n)})</b> ${o}</button>`).join("")}
function answer(n,b){if(locked)return;locked=true;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);let x=Q[i];if(n===x.a){hits++;cr++;score+=120;energy=Math.min(100,energy+5);b.style.background="#c8ffd8";$("feedback").textContent="✅ CERTO! CRISTAL COLETADO!";crystal();launch();$("ship").style.bottom=(55+Math.min(230,(i+1)*22))+"px";$("ship").classList.add("boosting");setTimeout(()=>$("ship").classList.remove("boosting"),600)}else{energy=Math.max(10,energy-5);b.style.background="#ffd2da";document.querySelectorAll(".ans")[x.a].style.background="#c8ffd8";$("feedback").textContent="⚠️ DESVIO! A correta foi destacada.";errorFx()}$("crystals").textContent=cr;$("score").textContent=score;$("energy").textContent=energy+"%";setTimeout(next,1050)}
function next(){i++;if(i>=10)finish();else render()}
function finish(){clearInterval(timer);clearInterval(musicTimer);$("game").classList.add("hidden");$("finish").classList.remove("hidden");[440,660,880,1100].forEach((f,k)=>tone(f,.35,"triangle",.05,k*.14));$("fHits").textContent=`${hits}/10`;$("fCrystals").textContent=cr;$("fScore").textContent=score;$("fTime").textContent=$("clock").textContent}
</script></body></html>
